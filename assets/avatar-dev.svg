<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#26363d"/>
      <stop offset="1" stop-color="#0a0e10"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3cff9a" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#1fd47a" stop-opacity=".15"/>
      <stop offset="1" stop-color="#1fd47a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glass" cx="50%" cy="55%" r="65%">
      <stop offset="0" stop-color="#c8ffe0"/>
      <stop offset=".6" stop-color="#3fd98a"/>
      <stop offset="1" stop-color="#138a52"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b464d"/>
      <stop offset=".5" stop-color="#6b7a83"/>
      <stop offset="1" stop-color="#3b464d"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fff8"/>
      <stop offset="1" stop-color="#9dffc8"/>
    </linearGradient>
    <radialGradient id="fog">
      <stop offset="0" stop-color="#dfe7ea" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#dfe7ea" stop-opacity=".2"/>
      <stop offset="1" stop-color="#dfe7ea" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="320" cy="335" r="250" fill="url(#glow)"/>

  <!-- fog behind -->
  <g fill="url(#fog)">
    <ellipse cx="160" cy="470" rx="230" ry="70" opacity=".45"/>
    <ellipse cx="490" cy="445" rx="220" ry="60" opacity=".35"/>
  </g>

  <!-- lantern -->
  <g stroke-linejoin="round" transform="translate(320 320) scale(1.18) translate(-320 -315)">
    <circle cx="320" cy="168" r="26" fill="none" stroke="url(#metal)" stroke-width="10"/>
    <path d="M272 214 H368 L398 250 H242 Z" fill="url(#metal)"/>
    <rect x="300" y="190" width="40" height="26" rx="6" fill="url(#metal)"/>
    <rect x="252" y="250" width="136" height="172" rx="8" fill="url(#glass)"/>
    <path d="M320 286 C346 322 354 350 336 377 C328 389 312 389 304 377 C286 350 294 322 320 286 Z" fill="url(#flame)"/>
    <g stroke="url(#metal)" stroke-width="12" fill="none">
      <rect x="252" y="250" width="136" height="172" rx="8"/>
    </g>
    <path d="M240 420 H400 L372 454 H268 Z" fill="url(#metal)"/>
  </g>

  <!-- fog in front -->
  <g fill="url(#fog)">
    <ellipse cx="300" cy="488" rx="300" ry="62" opacity=".7"/>
    <ellipse cx="400" cy="560" rx="340" ry="85" opacity=".55"/>
    <ellipse cx="120" cy="545" rx="220" ry="70" opacity=".5"/>
  </g>

  <!-- DEV badge (letters are paths: no font dependency) -->
  <rect x="215" y="468" width="210" height="84" rx="42" fill="#0e7a45" stroke="#c8ffe0" stroke-width="5"/>
  <g transform="translate(248 482)" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0 V56 H12 C46 56 46 0 12 0 Z"/>
    <path d="M90 0 H58 V56 H90 M58 28 H84"/>
    <path d="M106 0 L124 56 L142 0"/>
  </g>
</svg>
